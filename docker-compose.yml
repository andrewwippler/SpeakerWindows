version: '2'
services:
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"

  db:
    image: pgvector/pgvector:pg17
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
      - ./api/database/docker-seed.sql:/docker-entrypoint-initdb.d/docker-seed.sql
    environment:
      POSTGRES_PASSWORD: adonis
      POSTGRES_DB: speaker_illus
    ports:
      - "127.0.0.1:5432:5432"

  monolith:
    container_name: speakerwindows
    restart: always
    build:
      context: api/.
      target: production
    ports:
      - "3333:3333"
    env_file:
      - api/.env
    depends_on:
      - db
      - redis
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - REDIS_HOST=redis
