# Docker Build and Push

name: Build, Push, and Deploy

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: d.wplr.rocks
  REPOSITORY: speakerwindows

jobs:
  build_monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: d.wplr.rocks
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PW }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Monolith image
        uses: docker/build-push-action@v6
        with:
          context: api/.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.REPOSITORY }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPOSITORY }}:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: [build_monolith]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Trigger external webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Key: $WEBHOOK_SECRET" \
            -d "{
              \"repository\": \"${{ github.repository }}\",
              \"ref\": \"${{ github.ref }}\",
              \"sha\": \"${{ github.sha }}\",
              \"actor\": \"${{ github.actor }}\",
              \"version\": \"${{ github.sha }}\",
              \"ns\": \"web\",
              \"deploy\": \"speakerwindows\",
              \"container\": \"speakerwindows-api\",
              \"prefix\": \"${{ env.REGISTRY }}\"
            }"