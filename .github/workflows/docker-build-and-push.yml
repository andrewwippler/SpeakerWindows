# Docker Build and Push

name: Build, Push, and Deploy

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: d.wplr.rocks
  REPOSITORY: speakerwindows

jobs:
  build_monolith:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: d.wplr.rocks
          username: ${{ secrets.REG_USER }}
          password: ${{ secrets.REG_PW }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Monolith image
        uses: docker/build-push-action@v6
        with:
          context: api/.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:monolith-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}:monolith-latest
            ghcr.io/${{ github.repository_owner }}/${{ env.REPOSITORY }}:monolith-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ env.REPOSITORY }}:monolith-latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: [build_monolith]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Updating Monolith
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: kubedeploy
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: kubectl --namespace web set image deployment/speakerwindows monolith=${{ env.REGISTRY }}/${{ env.REPOSITORY }}:monolith-${{ github.sha }}
